        <p id="text1" class="text"><!--Total: 0--></p>

<script>
    const main = document.querySelector('div.main');
    const text = document.getElementById('text1');
    const settings = {
        size: '100x100',
        chunks: 20,
        perChunk: 10,
        msBetweenChunks: 3000
        //imgStyle: 'border: 1px solid black;'
    };
    let chunks = 0;
    const interval = setInterval(intervalHandler, settings.msBetweenChunks);
    intervalHandler();
    function intervalHandler() {
        if (++chunks > settings.chunks) {
            clearInterval(interval);
            console.log('Interval cleared');
        }
        // text.innerHTML = `Total: ${chunks * settings.perChunk}`;
        for (let i = 0; i < settings.perChunk; i++) {
            const rand = Math.random();
            const url = `https://robohash.org/${rand}?set=set5${settings.size !== undefined ? `&size=${settings.size}` : ''}`;
            main.innerHTML += `<a href="${url}" target="_blank"><img src="${url}" ${settings.imgStyle !== undefined ? `style="${settings.imgStyle}"` : ''}/></a>`;
        }
    }
